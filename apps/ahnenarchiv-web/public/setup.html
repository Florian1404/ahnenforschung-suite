<!doctype html><html lang="de"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahnenarchiv einrichten</title><link rel="stylesheet" href="/static/style.css"><body><main class="auth-shell"><section class="card"><h1>Ahnenarchiv einrichten</h1><p>Einmalige Einrichtung: Daten importieren und deinen Admin anlegen.</p><form id="setup-form" method="post" action="/api/setup" autocomplete="off"><label>Einrichtungsschlüssel aus config.php</label><input name="key" type="password" required autocomplete="off"><label>Dein Name</label><input name="name" value="" required><label>Deine E-Mail</label><input name="email" type="email" required autocomplete="username"><label>Admin-Passwort (mindestens 12 Zeichen)</label><input name="password" type="password" minlength="12" required autocomplete="new-password"><label>Passwort wiederholen</label><input name="repeat" type="password" minlength="12" required autocomplete="new-password"><p id="setup-message" role="status"></p><button class="primary">Archiv einrichten</button></form><p>Die Einrichtung überschreibt keine vorhandenen Datensätze. Ein bereits eingerichtetes Archiv kann hier nicht erneut installiert werden.</p></section></main><script src="/static/setup.js?v=1.4.3"></script></body></html>
